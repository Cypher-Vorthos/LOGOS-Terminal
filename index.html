<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOGOS // Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050805">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     LOGOS TERMINAL — Cypher Vorthos Multiverse
     ============================================================ */
  :root{
    --bg:#050805;
    --phosphor:#3dff7a;
    --phosphor-dim:#12a83f;
    --phosphor-faint:#0a5c22;
    --amber:#ff8a3d;
    --glow: rgba(61,255,122,0.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:'Share Tech Mono', monospace;
    color:var(--phosphor);
  }

  /* ---------- CRT frame ---------- */
  #crt{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
  }
  #crt::before{ /* scanlines */
    content:""; position:absolute; inset:0; z-index:50; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0.15) 1px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0) 3px
    );
    mix-blend-mode:multiply;
  }
  #crt::after{ /* vignette */
    content:""; position:absolute; inset:0; z-index:51; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  .sweep{
    position:absolute; left:0; right:0; height:120px; z-index:49; pointer-events:none;
    background:linear-gradient(to bottom, rgba(61,255,122,0) 0%, rgba(61,255,122,0.05) 50%, rgba(61,255,122,0) 100%);
    animation:sweep 9s linear infinite;
  }
  @keyframes sweep{
    0%{ top:-120px; }
    100%{ top:100%; }
  }
  .flicker{
    position:absolute; inset:0; z-index:52; pointer-events:none;
    background:rgba(61,255,122,0.02);
    animation:flick 6.5s infinite;
  }
  @keyframes flick{
    0%,100%{opacity:0;}
    92%{opacity:0;}
    93%{opacity:1;}
    94%{opacity:0;}
    97%{opacity:0.6;}
    98%{opacity:0;}
  }

  /* ============================================================
     BOOT SEQUENCE
     ============================================================ */
  #boot{
    position:absolute; inset:0; z-index:200;
    background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:4vw;
    gap:3vh;
    transition:opacity 1.5s ease-out;
  }
  #boot.fade{ opacity:0; pointer-events:none; }
  #boot.gone{ display:none; }

  .dice-container{
    perspective:900px;
    display:flex; gap:32px;
    justify-content:center; align-items:center;
    height:130px;
  }
  .die{
    width:80px; height:80px;
    position:relative;
    transform-style:preserve-3d;
    animation-duration:2.6s;
    animation-timing-function:cubic-bezier(0.16, 1, 0.3, 1);
    animation-fill-mode:forwards;
  }
  .die-1{ animation-name:tumble1; }
  .die-2{ animation-name:tumble2; }
  .die-3{ animation-name:tumble3; }
  @keyframes tumble1{
    0%   { transform:rotateX(0)      rotateY(0)      rotateZ(0); }
    100% { transform:rotateX(1440deg) rotateY(-1080deg) rotateZ(720deg); }
  }
  @keyframes tumble2{
    0%   { transform:rotateX(0)       rotateY(0)      rotateZ(0); }
    100% { transform:rotateX(-1260deg) rotateY(1440deg) rotateZ(-540deg); }
  }
  @keyframes tumble3{
    0%   { transform:rotateX(0)      rotateY(0)       rotateZ(0); }
    100% { transform:rotateX(1080deg) rotateY(-1260deg) rotateZ(900deg); }
  }
  .face{
    position:absolute; width:80px; height:80px;
    border:1.5px solid var(--phosphor);
    background:rgba(5,10,5,0.85);
    display:flex; align-items:center; justify-content:center;
    color:var(--phosphor); font-size:13px;
    box-shadow:0 0 12px rgba(61,255,122,0.35) inset, 0 0 6px rgba(61,255,122,0.35);
    text-shadow:0 0 6px var(--glow);
    letter-spacing:0.05em;
  }
  .f-front  { transform:translateZ(40px); }
  .f-back   { transform:rotateY(180deg) translateZ(40px); }
  .f-right  { transform:rotateY(90deg)  translateZ(40px); }
  .f-left   { transform:rotateY(-90deg) translateZ(40px); }
  .f-top    { transform:rotateX(90deg)  translateZ(40px); }
  .f-bottom { transform:rotateX(-90deg) translateZ(40px); }

  #boot-lines{
    min-height:35vh;
    font-size:clamp(13px, 1.6vw, 20px);
    line-height:1.7;
    letter-spacing:0.05em;
    text-shadow:0 0 6px var(--glow);
    text-align:left;
    width:min(720px, 90vw);
    white-space:pre-wrap;
  }
  #boot-lines .caret{
    display:inline-block; width:0.55em; height:1em; background:var(--phosphor);
    animation:blink 1s steps(1) infinite; vertical-align:text-bottom;
    margin-left:2px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ============================================================
     DASHBOARD
     ============================================================ */
  #dash{
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:2.5vh 3vw 5vh 3vw;
    opacity:0;
    transition:opacity 1.5s ease-in;
    position:relative;
  }
  #dash.show{ opacity:1; }

  .top-block{
    display:flex; flex-direction:column; align-items:center;
    gap:1vh;
  }
  #logo{
    width:clamp(150px, 18vw, 240px);
    height:auto;
    filter:drop-shadow(0 0 8px var(--glow));
  }
  .subtitle-block{ text-align:center; margin-top:0.5vh; }
  .brand{
    font-size:clamp(20px, 2.4vw, 32px);
    letter-spacing:0.4em;
    text-shadow:0 0 8px var(--glow);
  }
  .subtitle{
    font-size:clamp(10px, 1.1vw, 14px);
    letter-spacing:0.35em;
    color:var(--phosphor-dim);
    margin-top:0.4em;
  }

  #clock-row{
    display:flex; flex-direction:column; align-items:center;
    margin-top:1.5vh;
  }
  #clock{
    font-size:clamp(44px, 8vw, 108px);
    font-weight:400;
    letter-spacing:0.05em;
    text-shadow:0 0 12px var(--glow), 0 0 28px var(--glow);
    line-height:1;
  }
  #date{
    font-size:clamp(12px, 1.6vw, 20px);
    color:var(--phosphor-dim);
    margin-top:0.5em;
    letter-spacing:0.15em;
  }

  #market{
    display:flex; gap:6vw; flex-wrap:wrap; justify-content:center;
    margin-top:2vh;
  }
  .coin{ text-align:center; }
  .coin .sym{ font-size:clamp(12px,1.4vw,18px); color:var(--phosphor-dim); letter-spacing:0.2em; }
  .coin .price{ font-size:clamp(26px,3.6vw,50px); text-shadow:0 0 10px var(--glow); }
  .coin .chg{ font-size:clamp(12px,1.4vw,18px); margin-top:0.2em; }
  .up{ color:var(--phosphor); }
  .down{ color:var(--amber); text-shadow:0 0 8px rgba(255,138,61,0.5); }

  #status{
    display:flex; gap:5vw; flex-wrap:wrap; justify-content:center;
    font-size:clamp(10px,1.1vw,14px);
    color:var(--phosphor-dim);
    letter-spacing:0.15em;
    border-top:1px solid var(--phosphor-faint);
    border-bottom:1px solid var(--phosphor-faint);
    padding:1.4vh 0;
    margin-top:2.5vh;
    width:100%;
    text-align:center;
  }
  #status span.val{ color:var(--phosphor); }

  /* ---------- Starfield ---------- */
  #starfield-wrap{
    flex:1;
    position:relative;
    margin-top:2vh;
    min-height:120px;
  }
  #starfield{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }

  #motto{
    text-align:center;
    font-size:clamp(11px,1.2vw,15px);
    color:var(--phosphor-dim);
    letter-spacing:0.5em;
    margin-top:1vh;
    text-shadow:0 0 6px rgba(61,255,122,0.3);
  }
</style>
</head>
<body>

<div id="crt">
  <div class="sweep"></div>
  <div class="flicker"></div>

  <!-- ============================================================
       BOOT SEQUENCE
       ============================================================ -->
  <div id="boot">
    <div class="dice-container">
      <div class="die die-1">
        <div class="face f-front">P(A)</div>
        <div class="face f-back">Σxᵢpᵢ</div>
        <div class="face f-right">½k</div>
        <div class="face f-left">∫eˣdx</div>
        <div class="face f-top">∇·Á</div>
        <div class="face f-bottom">ψ(x)</div>
      </div>
      <div class="die die-2">
        <div class="face f-front">ψ(x)</div>
        <div class="face f-back">ℏ</div>
        <div class="face f-right">exp(iS/ℏ)</div>
        <div class="face f-left">Cⁿₖ</div>
        <div class="face f-top">Δp</div>
        <div class="face f-bottom">P(B)</div>
      </div>
      <div class="die die-3">
        <div class="face f-front">ℏ</div>
        <div class="face f-back">Δp≥ℏ/2</div>
        <div class="face f-right">eⁱᵖ</div>
        <div class="face f-left">∇×B</div>
        <div class="face f-top">⟨φ|</div>
        <div class="face f-bottom">|ψ⟩</div>
      </div>
    </div>
    <div id="boot-lines"></div>
  </div>

  <!-- ============================================================
       DASHBOARD
       ============================================================ -->
  <div id="dash">
    <div class="top-block">
      <!-- LOGOS LOGO: three isometric dice with formula faces + all-seeing eye triangle -->
      <svg id="logo" viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.6" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <g stroke="#3dff7a" fill="none" stroke-width="1.4" stroke-linejoin="round" filter="url(#logo-glow)">

          <!-- Back cube (top center) — L=42, anchored at (150, 90) -->
          <g transform="translate(150 90)">
            <!-- top face rhombus -->
            <path d="M 0 -42 L 36.4 -21 L 0 0 L -36.4 -21 Z"/>
            <!-- left face -->
            <path d="M 0 0 L -36.4 -21 L -36.4 21 L 0 42 Z"/>
            <!-- right face -->
            <path d="M 0 0 L 36.4 -21 L 36.4 21 L 0 42 Z"/>
            <!-- formulas -->
            <text x="0" y="-19" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="9" fill="#3dff7a" stroke="none">P(A)</text>
            <text x="18" y="8" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="9" fill="#3dff7a" stroke="none">ψ(x)</text>
            <text x="-18" y="8" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10" fill="#3dff7a" stroke="none">ℏ</text>
          </g>

          <!-- Front-left cube — anchored at (95, 175) -->
          <g transform="translate(95 175)">
            <path d="M 0 -42 L 36.4 -21 L 0 0 L -36.4 -21 Z"/>
            <path d="M 0 0 L -36.4 -21 L -36.4 21 L 0 42 Z"/>
            <path d="M 0 0 L 36.4 -21 L 36.4 21 L 0 42 Z"/>
            <text x="0" y="-19" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10" fill="#3dff7a" stroke="none">½k</text>
            <text x="18" y="8" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8" fill="#3dff7a" stroke="none">Σxp</text>
            <text x="-18" y="8" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8" fill="#3dff7a" stroke="none">∫eˣ</text>
          </g>

          <!-- Front-right cube — anchored at (205, 175) -->
          <g transform="translate(205 175)">
            <path d="M 0 -42 L 36.4 -21 L 0 0 L -36.4 -21 Z"/>
            <path d="M 0 0 L -36.4 -21 L -36.4 21 L 0 42 Z"/>
            <path d="M 0 0 L 36.4 -21 L 36.4 21 L 0 42 Z"/>
            <text x="0" y="-19" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="10" fill="#3dff7a" stroke="none">Δp</text>
            <text x="18" y="8" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8" fill="#3dff7a" stroke="none">eⁱˢ</text>
            <text x="-18" y="8" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8" fill="#3dff7a" stroke="none">Cⁿₖ</text>
          </g>

          <!-- All-seeing eye triangle (front center) -->
          <g transform="translate(150 180)">
            <!-- radiating beams -->
            <g stroke="#3dff7a" stroke-width="0.8" opacity="0.7">
              <line x1="0" y1="-40" x2="0" y2="-52"/>
              <line x1="-14" y1="-32" x2="-22" y2="-42"/>
              <line x1="14" y1="-32" x2="22" y2="-42"/>
              <line x1="-24" y1="-16" x2="-36" y2="-22"/>
              <line x1="24" y1="-16" x2="36" y2="-22"/>
              <line x1="-30" y1="0" x2="-42" y2="0"/>
              <line x1="30" y1="0" x2="42" y2="0"/>
            </g>
            <!-- triangle -->
            <path d="M 0 -32 L 28 20 L -28 20 Z" stroke-width="1.6" fill="rgba(5,10,5,0.9)"/>
            <!-- eye almond shape -->
            <path d="M -14 2 Q 0 -10 14 2 Q 0 12 -14 2 Z" stroke-width="1.2"/>
            <!-- iris -->
            <circle cx="0" cy="2" r="4.5" stroke-width="1.2"/>
            <!-- pupil -->
            <circle cx="0" cy="2" r="1.6" fill="#3dff7a"/>
          </g>

        </g>
      </svg>

      <div class="subtitle-block">
        <div class="brand">LOGOS</div>
        <div class="subtitle">CYPHER VORTHOS MULTIVERSE TERMINAL</div>
      </div>
    </div>

    <div id="clock-row">
      <div id="clock">00:00:00</div>
      <div id="date">—</div>
    </div>

    <div id="market">
      <div class="coin">
        <div class="sym">BTC / USD</div>
        <div class="price" id="btc-price">-- --</div>
        <div class="chg" id="btc-chg">--</div>
      </div>
      <div class="coin">
        <div class="sym">ETH / USD</div>
        <div class="price" id="eth-price">-- --</div>
        <div class="chg" id="eth-chg">--</div>
      </div>
    </div>

    <div id="status">
      <div>UPTIME: <span class="val" id="uptime">00:00:00</span></div>
      <div>LINK: <span class="val" id="netstate">--</span></div>
      <div>PLANE: <span class="val" id="plane">--</span></div>
      <div>FEED: <span class="val" id="feedstate">SYNCING</span></div>
    </div>

    <div id="starfield-wrap">
      <canvas id="starfield"></canvas>
    </div>

    <div id="motto">BEHOLD &middot; UTTER &middot; RULE</div>
  </div>
</div>

<script>
/* ============================================================
   USER CONFIG — edit this to change the current plane/game
   ============================================================ */
const CURRENT_PLANE = "TORIL";
// Examples:
//   "TORIL"    — Forgotten Realms (Neverwinter Nights, BG3, etc.)
//   "EARTH"    — real world / mundane plane
//   "ARDA"     — Middle-earth
//   "TAMRIEL"  — Elder Scrolls
//   "AZEROTH"  — WoW
//   "SIGIL"    — Planescape crossroads

/* ============================================================
   RESET SWITCH — load ?reset in the URL to force-wipe uptime + boot flag
   (normally not needed — closing and relaunching the app does this
   automatically now that uptime lives in sessionStorage)
   ============================================================ */
if (window.location.search.includes('reset')) {
  sessionStorage.removeItem('logos_uptime_start');
  sessionStorage.removeItem('logos_booted');
}

/* ============================================================
   BOOT SEQUENCE — dice roll, then slow typewriter lines
   ============================================================ */
const bootLinesEl = document.getElementById('boot-lines');
const bootEl = document.getElementById('boot');
const dashEl = document.getElementById('dash');

const bootLines = [
  { text: "L.O.G.O.S.  //  LIVING ONTOLOGICAL GNOSTIC OPERATING SYSTEM", pauseAfter: 900 },
  { text: "",                                                            pauseAfter: 200 },
  { text: "initializing terminal session...",                             pauseAfter: 700 },
  { text: "loading multiverse kernel............ OK",                     pauseAfter: 700 },
  { text: "connecting to the nearby leylines... OK",                      pauseAfter: 700 },
  { text: "establishing world wide web uplink............ OK",            pauseAfter: 900 },
];

const CHAR_MS = 32;   // typewriter speed per character
const DICE_MS = 2600; // dice tumble duration (matches CSS)
const POST_DICE_PAUSE = 700;
const POST_BOOT_PAUSE = 1400;

async function playBoot(){
  // wait for dice to settle
  await sleep(DICE_MS + POST_DICE_PAUSE);

  let buffer = "";
  for (const line of bootLines){
    // typewriter
    for (let i = 0; i < line.text.length; i++){
      buffer += line.text[i];
      bootLinesEl.innerHTML = buffer + '<span class="caret"></span>';
      await sleep(CHAR_MS);
    }
    buffer += "\n";
    bootLinesEl.innerHTML = buffer + '<span class="caret"></span>';
    await sleep(line.pauseAfter);
  }
  await sleep(POST_BOOT_PAUSE);

  bootEl.classList.add('fade');
  dashEl.classList.add('show');
  setTimeout(() => bootEl.classList.add('gone'), 1600);
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// Only play the boot once per browser session; refreshes skip straight to dash
if (sessionStorage.getItem('logos_booted')){
  bootEl.classList.add('gone');
  dashEl.classList.add('show');
} else {
  sessionStorage.setItem('logos_booted', '1');
  playBoot();
}

/* ============================================================
   CLOCK — 24h
   ============================================================ */
function pad(n){ return n.toString().padStart(2, '0'); }
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('date').textContent =
    `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(updateClock, 1000);
updateClock();

/* ============================================================
   UPTIME — persists across page reloads within the same session
   (via sessionStorage), but resets when the app is actually
   closed and relaunched, since that starts a fresh session
   ============================================================ */
let startTime = parseInt(sessionStorage.getItem('logos_uptime_start'), 10);
if (!startTime || isNaN(startTime)){
  startTime = Date.now();
  sessionStorage.setItem('logos_uptime_start', String(startTime));
}
function updateUptime(){
  const diff = Math.floor((Date.now() - startTime) / 1000);
  const d = Math.floor(diff / 86400);
  const h = Math.floor((diff % 86400) / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  const str = d > 0
    ? `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`
    : `${pad(h)}:${pad(m)}:${pad(s)}`;
  document.getElementById('uptime').textContent = str;
}
setInterval(updateUptime, 1000);
updateUptime();

/* ============================================================
   NETWORK STATUS
   ============================================================ */
function updateNet(){
  document.getElementById('netstate').textContent = navigator.onLine ? "ONLINE" : "OFFLINE";
}
window.addEventListener('online', updateNet);
window.addEventListener('offline', updateNet);
updateNet();
setInterval(updateNet, 5000);

/* ============================================================
   PLANE
   ============================================================ */
document.getElementById('plane').textContent = CURRENT_PLANE;

/* ============================================================
   CRYPTO TICKER (CoinGecko, no API key, updates every 60s)
   ============================================================ */
async function updatePrices(){
  const feedEl = document.getElementById('feedstate');
  try{
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true');
    const data = await res.json();

    const btcPrice = data.bitcoin.usd;
    const btcChg = data.bitcoin.usd_24h_change;
    const ethPrice = data.ethereum.usd;
    const ethChg = data.ethereum.usd_24h_change;

    document.getElementById('btc-price').textContent = '$' + btcPrice.toLocaleString(undefined, {maximumFractionDigits:0});
    document.getElementById('eth-price').textContent = '$' + ethPrice.toLocaleString(undefined, {maximumFractionDigits:0});

    const btcChgEl = document.getElementById('btc-chg');
    btcChgEl.textContent = (btcChg >= 0 ? '▲ ' : '▼ ') + Math.abs(btcChg).toFixed(2) + '%';
    btcChgEl.className = 'chg ' + (btcChg >= 0 ? 'up' : 'down');

    const ethChgEl = document.getElementById('eth-chg');
    ethChgEl.textContent = (ethChg >= 0 ? '▲ ' : '▼ ') + Math.abs(ethChg).toFixed(2) + '%';
    ethChgEl.className = 'chg ' + (ethChg >= 0 ? 'up' : 'down');

    feedEl.textContent = 'LIVE';
  } catch(e){
    feedEl.textContent = 'SIGNAL LOST';
  }
}
updatePrices();
setInterval(updatePrices, 60000);

/* ============================================================
   STARFIELD — cockpit POV, slow forward traversal
   ============================================================ */
(function starfield(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, dpr = window.devicePixelRatio || 1;

  const STAR_COUNT = 220;
  const PLANET_COUNT = 4;
  const SPEED = 0.6;         // very slow; increase for faster feel
  const FOCAL = 260;         // perspective focal length

  function resize(){
    const rect = canvas.getBoundingClientRect();
    w = rect.width; h = rect.height;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  function rand(min, max){ return Math.random() * (max - min) + min; }

  class Star{
    constructor(){ this.reset(true); }
    reset(initial){
      this.x = rand(-1, 1);
      this.y = rand(-1, 1);
      // spread stars along Z if initial so field starts populated
      this.z = initial ? rand(1, 900) : rand(700, 900);
      this.hue = Math.random() < 0.08 ? rand(180, 200) : 130; // occasional cool tint
    }
    step(){
      this.z -= SPEED;
      if (this.z <= 1) this.reset(false);
    }
    draw(){
      const scale = FOCAL / this.z;
      const px = this.x * 800 * scale + w / 2;
      const py = this.y * 800 * scale + h / 2;
      if (px < 0 || px > w || py < 0 || py > h) return;
      const size = Math.max(0.4, scale * 1.2);
      const alpha = Math.min(1, (900 - this.z) / 700);
      ctx.fillStyle = this.hue === 130
        ? `rgba(61, 255, 122, ${alpha * 0.9})`
        : `rgba(120, 200, 255, ${alpha * 0.85})`;
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Planet{
    constructor(){ this.reset(true); }
    reset(initial){
      this.x = rand(-1, 1);
      this.y = rand(-1, 1);
      this.z = initial ? rand(400, 1200) : rand(1000, 1200);
      // muted palette that fits phosphor terminal
      const palette = [
        [80, 180, 110],   // dim green
        [110, 90, 160],   // dim violet
        [180, 130, 70],   // dim amber
        [70, 120, 160],   // dim blue
      ];
      this.rgb = palette[Math.floor(Math.random() * palette.length)];
      this.radiusBase = rand(30, 70);
    }
    step(){
      this.z -= SPEED * 0.35; // planets even slower
      if (this.z <= 20) this.reset(false);
    }
    draw(){
      const scale = FOCAL / this.z;
      const px = this.x * 800 * scale + w / 2;
      const py = this.y * 800 * scale + h / 2;
      const r = this.radiusBase * scale;
      if (r < 0.6) return;
      if (px + r < 0 || px - r > w || py + r < 0 || py - r > h) return;
      const alpha = Math.min(0.5, (1200 - this.z) / 2400);
      const [rC, gC, bC] = this.rgb;
      const grad = ctx.createRadialGradient(px, py, 0, px, py, r);
      grad.addColorStop(0,   `rgba(${rC},${gC},${bC},${alpha})`);
      grad.addColorStop(0.7, `rgba(${rC},${gC},${bC},${alpha * 0.5})`);
      grad.addColorStop(1,   `rgba(${rC},${gC},${bC},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const stars = Array.from({length: STAR_COUNT}, () => new Star());
  const planets = Array.from({length: PLANET_COUNT}, () => new Planet());

  // throttle to ~30fps to be gentle on tablet battery
  const TARGET_MS = 33;
  let lastFrame = 0;

  function frame(t){
    if (t - lastFrame < TARGET_MS){
      requestAnimationFrame(frame);
      return;
    }
    lastFrame = t;

    // fade previous frame slightly instead of full clear — light motion trail
    ctx.fillStyle = 'rgba(5, 8, 5, 0.35)';
    ctx.fillRect(0, 0, w, h);

    for (const p of planets){ p.step(); p.draw(); }
    for (const s of stars){ s.step(); s.draw(); }

    requestAnimationFrame(frame);
  }

  // wait one tick so the canvas has laid out before we size it
  requestAnimationFrame(() => {
    resize();
    requestAnimationFrame(frame);
  });
})();

/* ============================================================
   PWA — register service worker so the page is installable
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {
      // fails silently on file:// or unsupported browsers — page still works fine
    });
  });
}
</script>
